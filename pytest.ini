[pytest]
testpaths = tests
# DB and model tests are opt-in (pytest -m db / -m model) so the auto-run hook never needs Docker or the model.
addopts = -m "not db and not model"
markers =
    db: needs the local Postgres container (docker compose up -d)
    model: needs the downloaded embedding model (python -m jobpilot.embed --download); never in CI
# Starlette asks for httpx2 but still works with httpx (its documented fallback); only a warning,
# so silenced here instead of adding a dependency. Remove once httpx2 is the norm.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`:UserWarning
