name: CI

# push on main + every pull_request: a PR branch runs once per push (as the PR), not twice.
# Branches without a PR don't run, which saves minutes on this private repo.
on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch/PR cancels the run it makes obsolete
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:pg17   # same image as docker-compose.yml
        env:
          # throwaway password: this container lives for one job and is never reachable from outside, so no secrets in CI
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jobs
        ports:
          - 5432:5432
        # the job waits until Postgres accepts connections before running any step
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip   # keyed on both requirement files, so unchanged deps download from cache
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Migrations
        # builds the empty service database from scratch, the same way a fresh local setup does
        env:
          DATABASE_URL: postgresql://jobs:ci@127.0.0.1:5432/jobs
        run: python -m jobpilot.migrate
      - name: Database tests
        # the pg fixture applies db/migrations into a throwaway schema;
        # JOBPILOT_REQUIRE_DB=1 makes it fail instead of skip if this database is unreachable
        env:
          DATABASE_URL: postgresql://jobs:ci@127.0.0.1:5432/jobs
          JOBPILOT_REQUIRE_DB: "1"
        run: python -m pytest -q -m db

  # builds the API image and pushes it to GitHub's container registry (ghcr.io), only on main and only
  # after the tests pass, so nothing untested ever becomes an image
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # this job alone may push images; the rest of the workflow stays read-only
    steps:
      - uses: actions/checkout@v5
      # GITHUB_TOKEN is created for each run and expires with it, so no registry password is stored anywhere
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # sha tag: never moves, so Azure can roll back to any earlier build; main: always the newest one.
      # Registry image names must be lowercase.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kaankababulut/jobpilot-api:sha-${{ github.sha }}
            ghcr.io/kaankababulut/jobpilot-api:main
